# Builds the web image with the API URL baked in (NEXT_PUBLIC_* is build-time).
# Usage: gcloud builds submit web --config web/cloudbuild.yaml \
#          --substitutions=_API_URL=https://...,_IMAGE=REGION-docker.pkg.dev/PROJECT/REPO/personapulse-web
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--build-arg", "NEXT_PUBLIC_API_URL=${_API_URL}", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
